name: Portfolio verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence policy and links
        run: python3 scripts/verify_portfolio.py
      - name: Test deployment health checker
        run: python3 -m unittest discover -s tests -v
